<title>La Liste Infernale</title>
<meta name="description" content="Jeu de culture en ligne de 2 à 6 joueurs : pariez combien de réponses vous citerez en 40 secondes.">

<script>// Adaptateur : expose la même interface « room » que claude.ai, branchée sur le serveur WebSocket du site.
window.LI_VOICE = true;
window.LI_STATS_API = "/api/stats";
window.LI_SUGGEST_URL = "https://formsubmit.co/ajax/lalisteinfernale@gmail.com";
(function(){
  const peerId = Math.random().toString(36).slice(2, 12);
  const rooms = new Map();
  let ws = null, open = false;
  const send = m => { if (open) try { ws.send(JSON.stringify(m)); } catch (e) {} };
  function connect(){
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => { open = true; for (const r of rooms.values()) { send({ t:'join', room:r.name, peer:peerId }); send({ t:'presence', room:r.name, patch:r.mine, full:true }); } };
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      const r = rooms.get(m.room); if (!r) return;
      if (m.t === 'peers') {
        r.list = Object.freeze(m.peers.map(p => ({ peer:p.peer, isMe:p.peer === peerId, sameTab:p.peer === peerId, kind:'viewer', guest:false, by:null,
          presence: p.peer === peerId ? r.mine : (p.presence || {}), updatedAt: Date.now() })));
        r.subs.forEach(f => { try { f({ peers:r.list, joined:[], left:[], updated:[] }); } catch (err) { console.error(err); } });
      } else if (m.t === 'full') { alert0('Cette partie est pleine.'); }
    };
    ws.onclose = () => { open = false; setTimeout(connect, 1200); };
  }
  function alert0(msg){ const t = document.getElementById('toast'); if (t) { t.textContent = msg; t.hidden = false; } }
  connect();
  const room = {
    async join(name){
      if (rooms.has(name)) return rooms.get(name).api;
      const r = { name, mine:{}, list:Object.freeze([]), subs:new Set() };
      r.api = {
        name,
        async presence(patch){ r.mine = Object.assign({}, r.mine, patch); for (const k in patch) if (patch[k] === null) delete r.mine[k]; send({ t:'presence', room:name, patch }); },
        peers: () => r.list,
        onPeers(f){ r.subs.add(f); setTimeout(() => f({ peers:r.list, joined:[], left:[], updated:[] }), 0); return () => r.subs.delete(f); },
        connected: () => open,
        async leave(){ send({ t:'leave', room:name }); rooms.delete(name); }
      };
      rooms.set(name, r);
      send({ t:'join', room:name, peer:peerId });
      return r.api;
    }
  };
  window.claude = { use: async n => n === 'room' ? room : null };
})();
</script>

<style>
/* Layout : une scène centrale (carte papier épaisse, ombre dure) sur fond lave, HUD de scores au-dessus. Look unique, assumé (pas de mode sombre). */
:root{
  --lava:#FFC4A8; --lava-deep:#F7A98C; --dots:rgba(28,11,43,.08); --on-bg:#1C0B2B; --on-bg-muted:#6E4E5F; --ink:#1C0B2B; --paper:#FFF4DC; --paper-2:#FFE7B8;
  --sun:#FFD83A; --ok:#11A866; --bad:#E0123A; --muted:#6E4E5F;
  --p0:#2F5BFF; --p1:#00A97C; --p2:#FF2E8B; --p3:#8A3FFC; --p4:#E07A00; --p5:#0098B8;
  --fam-pop:#FF2E8B; --fam-geo:#2F5BFF; --fam-nature:#00A97C; --fam-food:#FF8A00; --fam-brands:#8A3FFC;
  --fam-daily:#0098B8; --fam-science:#4636D9; --fam-sport:#E0123A; --fam-culture:#B07A00;
  --f-display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --f-body:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --r:18px; --sh:6px 6px 0 var(--ink); --sh-s:3px 3px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.4;
  background-color:var(--lava);
  background-image:radial-gradient(var(--dots) 1.6px,transparent 1.8px),linear-gradient(180deg,var(--lava) 0%,var(--lava-deep) 100%);
  background-size:18px 18px,100% 100%; min-height:100vh;
  padding-block:16px 40px; padding-inline:16px;
}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:22px;min-width:0}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;align-items:start}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:var(--f-display);font-size:15px;text-transform:uppercase;padding:9px 16px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--sun)}
.tab:focus-visible{outline:4px solid var(--p0);outline-offset:3px}
textarea.inp{resize:vertical;font-weight:600;font-size:17px;line-height:1.4}
.btn{
  font-family:var(--f-display);font-size:16px;text-transform:uppercase;letter-spacing:.02em;
  background:var(--sun);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);
  padding:12px 18px;cursor:pointer;transition:transform .06s,box-shadow .06s;white-space:nowrap
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn.alt{background:var(--paper)}
.btn.hot{background:var(--p2);color:#fff}
.btn.blue{background:var(--p0);color:#fff}
.btn.big{font-size:22px;padding:16px 26px}
.btn.sm{font-size:13px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink)}
.btn:focus-visible,.inp:focus-visible,.theme:focus-visible,.jok:focus-visible{outline:4px solid var(--p0);outline-offset:3px}
.inp{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:11px 14px;font-size:18px;font-weight:700;min-width:0;width:100%}
.inp::placeholder{color:#a58c97;font-weight:600}
label.lbl{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--paper);white-space:nowrap}

/* logo */
.logo{display:flex;flex-direction:column;align-items:flex-start;line-height:.9;transform:rotate(-2.5deg);margin:6px 0 4px}
.logo .a{font-family:var(--f-display);font-size:clamp(26px,6vw,46px);color:var(--paper);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.logo .b{font-family:var(--f-display);font-size:clamp(44px,11vw,92px);color:var(--sun);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink);letter-spacing:-.01em}
.logo.small{transform:rotate(-2deg);flex-direction:row;align-items:baseline;gap:8px}
.logo.small .a{font-size:16px;text-shadow:2px 2px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink)}
.logo.small .b{font-size:24px;text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink)}
.tagline{font-weight:800;font-size:19px;color:var(--ink);max-width:44ch}

/* HUD */
.hud{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.hud .meta{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 14px;background:var(--ink);color:var(--paper);border-radius:14px;border:3px solid var(--ink);min-width:0}
.hud .meta b{font-family:var(--f-display);font-size:18px;color:var(--sun);font-weight:400}
.hud .meta span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.score{flex:1 1 170px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh-s);padding:8px 12px;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.score .nm{display:flex;align-items:center;gap:6px;font-weight:800;line-height:1.15;min-width:0}
.score .nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .pts{font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.score .pts small{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--muted)}
.score .bar{height:8px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--c,var(--sun));transition:width .5s}
.score .jk{display:flex;gap:4px}
.score .jk i{width:20px;height:20px;border:2px solid var(--ink);border-radius:6px;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;background:var(--sun)}
.score .jk i.off{background:transparent;opacity:.3;text-decoration:line-through}
.score.lead{outline:3px dashed var(--ink);outline-offset:3px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--c);flex:none}

/* stage */
.stage{display:flex;flex-direction:column;gap:18px}
.phase-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.phase-h h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4.5vw,34px);line-height:1.05}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.timer{display:flex;align-items:center;gap:12px;min-width:min(240px,100%);flex:1 1 220px;max-width:380px}
.timer .n{font-family:var(--f-display);font-size:34px;line-height:1;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.timer .tb{flex:1;height:18px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.timer .tb i{display:block;height:100%;background:var(--sun);border-right:3px solid var(--ink)}
.timer.warn .tb i{background:var(--bad)}
.timer.warn .n{color:var(--bad)}

.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.theme{box-sizing:border-box;cursor:pointer;font:inherit;color:inherit;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:12px;min-height:170px;transition:transform .08s,box-shadow .08s;position:relative;overflow:hidden}
.theme::before{content:"";position:absolute;inset:0 0 auto 0;height:12px;background:var(--fc);border-bottom:3px solid var(--ink)}
.theme .fam{margin-top:6px;align-self:flex-start;background:var(--fc);color:#fff}
.theme .tt{font-family:var(--f-display);font-size:21px;line-height:1.12}
.theme .hint{font-size:14px;font-weight:700;color:var(--muted);margin-top:auto}
.theme:not([aria-disabled="true"]):hover{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:9px 9px 0 var(--ink)}
.theme[aria-disabled="true"]{cursor:default}
.theme.pick{background:var(--sun);transform:rotate(-1deg) scale(1.02)}

.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:var(--r);padding:16px 20px;border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(28,11,43,.35)}
.banner .tt{font-family:var(--f-display);font-size:clamp(20px,4vw,28px);color:var(--sun);line-height:1.1;min-width:0}
.banner .fam{background:var(--fc);color:#fff;border-color:var(--paper)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:2px solid var(--ink);border-radius:99px;font-weight:800;background:#fff;animation:pop .25s ease-out}
.chip.ok{background:var(--ok);color:#fff}
.chip.ko{background:#fff;color:var(--bad);text-decoration:line-through;opacity:.8}
.chip.wait{background:transparent;border-style:dashed;color:var(--muted)}
.chip.done{background:var(--sun)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

.stepper{display:flex;align-items:center;gap:10px}
.stepper .val{font-family:var(--f-display);font-size:64px;line-height:1;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 10px}
.stepper .btn{font-size:28px;padding:6px 16px}

.bets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.betcard{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh-s);padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:flip .5s both}
.betcard .n{font-family:var(--f-display);font-size:52px;line-height:1}
.betcard.top{background:var(--sun);transform:rotate(-2deg) scale(1.05)}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}

.jokers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.jok{all:unset;box-sizing:border-box;cursor:pointer;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh-s);padding:14px;display:flex;flex-direction:column;gap:6px}
.jok .ic{font-family:var(--f-display);font-size:30px;line-height:1}
.jok .nm{font-family:var(--f-display);font-size:16px}
.jok .ds{font-size:14px;font-weight:700;color:var(--muted)}
.jok:hover:not([aria-disabled="true"]){transform:translate(-1px,-2px);box-shadow:5px 5px 0 var(--ink)}
.jok[aria-disabled="true"]{opacity:.4;cursor:default}
.jok.on{background:var(--sun);opacity:1}

.big-count{display:flex;align-items:baseline;gap:10px;justify-content:center;font-family:var(--f-display);line-height:1}
.big-count .a{font-size:clamp(64px,16vw,120px);color:var(--ink)}
.big-count .b{font-size:clamp(28px,7vw,48px);color:var(--muted)}
.big-count.win .a{color:var(--ok)}
.answer-box{display:flex;gap:10px}
.answer-box .inp{font-size:24px;padding:14px 16px}
.fb{min-height:32px;font-weight:800;font-size:18px;text-align:center}
.fb.ok{color:var(--ok)} .fb.ko{color:var(--bad)} .fb.dup{color:var(--muted)}
.countdown{font-family:var(--f-display);font-size:clamp(90px,25vw,180px);text-align:center;line-height:1;color:var(--sun);-webkit-text-stroke:4px var(--ink);text-shadow:8px 8px 0 var(--ink);animation:pop .3s}

.verdict{font-family:var(--f-display);font-size:clamp(40px,10vw,76px);line-height:1;text-align:center;transform:rotate(-2deg)}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--bad)}
.gain{font-weight:800;font-size:20px;text-align:center}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pl{display:flex;align-items:center;gap:10px;padding:12px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:800;min-width:0}
.pl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.pl.empty{border-style:dashed;background:transparent;color:var(--muted);font-weight:700}
.team-col{display:flex;flex-direction:column;gap:10px;padding:12px;border:3px solid var(--ink);border-radius:16px;background:var(--paper-2)}
.code{font-family:var(--f-display);font-size:clamp(40px,10vw,64px);letter-spacing:.12em;background:var(--ink);color:var(--sun);padding:6px 18px;border-radius:14px;display:inline-block;line-height:1.1}
.rules ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.rules details summary{cursor:pointer;font-family:var(--f-display);font-size:18px}
.note{background:var(--paper-2);border:2px dashed var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 13px;font-weight:800;background:#fff;border:3px solid var(--ink);border-radius:12px}
.seg button[aria-pressed="true"]{background:var(--sun);box-shadow:2px 2px 0 var(--ink)}
.seg button:disabled{cursor:default;opacity:.75}
.seg button:focus-visible{outline:3px solid var(--p0);outline-offset:2px}
.voters{min-height:34px}
.vbtn{cursor:pointer;font:inherit}
.vbtn.done{background:var(--sun)}
.ballots{display:flex;flex-wrap:wrap;gap:12px}
.ballot{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:var(--sh-s);min-width:0;max-width:100%;border-top:10px solid var(--fc);transition:transform .08s}
.ballot .by{display:flex;gap:6px;align-items:center;font-weight:800;font-size:13px}
.ballot.on{background:var(--sun);transform:translateY(-4px) rotate(-1.5deg);box-shadow:6px 6px 0 var(--ink)}
.draw-result{animation:pop .35s}
.rare-tag{background:var(--sun);color:var(--ink);border-color:var(--paper)}
.bonus-line{font-weight:800;text-align:center;color:var(--ink);background:var(--sun);border:2px solid var(--ink);border-radius:99px;padding:4px 14px;align-self:center}
.feed{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;padding:10px;border:3px solid var(--ink);border-radius:14px;background:#fff}
.feed:empty::before{content:"Les réponses apparaîtront ici.";color:var(--muted);font-weight:700}
.msg{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;padding:6px 10px;border-radius:10px;border:2px solid var(--ink);animation:pop .2s;min-width:0}
.msg .who{font-weight:800;color:#fff;background:var(--c);padding:0 8px;border-radius:99px;font-size:13px}
.msg .txt{font-weight:700;overflow-wrap:anywhere}
.msg .res{margin-left:auto;font-weight:800;font-size:14px}
.msg.ok{background:#E3F7EE}.msg.ok .res{color:var(--ok)}
.msg.ko{background:#FDE7EC}.msg.ko .res{color:var(--bad)}.msg.ko .txt{text-decoration:line-through}
.msg.dup{background:var(--paper-2)}.msg.dup .res{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:800;max-width:calc(100% - 32px);z-index:50;box-shadow:4px 4px 0 rgba(0,0,0,.3)}
.overlay{position:fixed;inset:0;background:rgba(28,11,43,.6);display:grid;place-items:center;padding:16px;z-index:40}
.secret{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center}
.secret .nm{display:flex;gap:8px;align-items:center;font-weight:800;min-width:0}
.log{font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:4px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.foot{color:var(--ink);font-weight:700;font-size:13px;text-align:center;opacity:.75}
.mic{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mic .live{width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid var(--ink);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.heard{font-weight:700;color:var(--muted);font-size:15px;min-height:22px}
/* fonds au choix (pastel) */
:root[data-bg="blanc"]{--lava:#F8F6F1;--lava-deep:#EEEAE2;--dots:rgba(28,11,43,.07)}
:root[data-bg="noir"]{--lava:#2E2A36;--lava-deep:#24212B;--dots:rgba(255,244,220,.07);--on-bg:#FFF4DC;--on-bg-muted:#CDBFD0}
:root[data-bg="noir"] .logo .a,:root[data-bg="noir"] .logo .b{-webkit-text-stroke-color:#0B0810;text-shadow:3px 3px 0 #0B0810}
:root[data-bg="noir"] .logo.small .a{-webkit-text-stroke-width:0;color:var(--paper)}
:root[data-bg="vert"]{--lava:#D3EEDC;--lava-deep:#BCE3CA;--dots:rgba(28,11,43,.07)}
:root[data-bg="bleu"]{--lava:#D4E4F7;--lava-deep:#BED4F0;--dots:rgba(28,11,43,.07)}
:root[data-bg="rose"]{--lava:#F9D5E3;--lava-deep:#F3BFD3;--dots:rgba(28,11,43,.07)}
.tagline,.foot,.phase-h h2,.timer .n{color:var(--on-bg)}
.phase-h .eyebrow,.phase-h .muted{color:var(--on-bg-muted)}
.timer.warn .n{color:var(--bad)}
.bgpick{position:relative;z-index:30}
.bgpick>.btn{display:inline-flex;align-items:center;gap:8px}
.bgpick .sw{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--c);flex:none}
.bgpick .panel{position:absolute;right:0;top:calc(100% + 8px);background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh-s);padding:10px;display:grid;grid-template-columns:repeat(3,auto);gap:8px;min-width:max-content}
.bgpick .opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:10px;font-weight:800;font-size:13px;color:var(--ink)}
.bgpick .opt .sw{width:30px;height:30px;border-width:3px}
.bgpick .opt[aria-checked="true"]{background:var(--sun)}
.bgpick .opt:focus-visible{outline:3px solid var(--p0)}
.home-head{position:relative}
.home-head .bgpick{position:absolute;top:0;right:0}
@media (max-width:520px){
  .card{padding:16px}
  .secret{grid-template-columns:1fr 90px}
  .secret .btn{grid-column:1/-1}
  .answer-box{flex-direction:column}
  .stepper .val{font-size:52px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

'use strict';

const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

/* ========== couleur de fond ========== */
const BGS=[{k:'blanc',l:'Blanc',c:'#F8F6F1'},{k:'noir',l:'Noir',c:'#2E2A36'},{k:'vert',l:'Vert',c:'#D3EEDC'},{k:'bleu',l:'Bleu',c:'#D4E4F7'},{k:'rose',l:'Rose',c:'#F9D5E3'},{k:'orange',l:'Orange',c:'#FFC4A8'}];
function applyBg(k){if(!BGS.some(b=>b.k===k))k='orange';if(k==='orange')delete document.documentElement.dataset.bg;else document.documentElement.dataset.bg=k;LS.set('li-bg',k)}
applyBg(LS.get('li-bg','orange'));
function bgPicker(){
  const cur=()=>BGS.find(b=>b.k===LS.get('li-bg','orange'))||BGS[5];
  const wrap=h('div',{class:'bgpick'});
  const sw=h('span',{class:'sw',style:`--c:${cur().c}`});
  const btn=h('button',{class:'btn sm alt','aria-haspopup':'true','aria-expanded':'false'},sw,'Fond');
  const panel=h('div',{class:'panel',role:'radiogroup','aria-label':'Couleur de fond',hidden:true});
  const close=()=>{panel.hidden=true;btn.setAttribute('aria-expanded','false');document.removeEventListener('pointerdown',outside,true)};
  const outside=e=>{if(!wrap.contains(e.target))close()};
  const draw=()=>panel.replaceChildren(...BGS.map(b=>h('button',{class:'opt',role:'radio','aria-checked':String(cur().k===b.k),onclick:()=>{applyBg(b.k);sw.style.setProperty('--c',b.c);draw();close()}},h('span',{class:'sw',style:`--c:${b.c}`}),b.l)));
  btn.onclick=()=>{if(panel.hidden){draw();panel.hidden=false;btn.setAttribute('aria-expanded','true');document.addEventListener('pointerdown',outside,true)}else close()};
  wrap.addEventListener('keydown',e=>{if(e.key==='Escape'){close();btn.focus()}});

}

/* ========== règles ========== */

/* ========== modèle ========== */
const G={

    case 'lobby':{

      g.players=g.players.filter(p=>ids.has(p.id));
      for(const p of g.players){const pr=p.id===ME.pid?{n:ME.name}:S.peers.get(p.id);if(pr&&typeof pr.n==='string'&&pr.n)p.n=pr.n.slice(0,16)}
      for(const [pid,pr] of S.peers){if(g.players.length>=MAX_PLAYERS)break;if(!g.players.some(p=>p.id===pid)){
        const usedC=new Set(g.players.map(p=>p.c));let c=0;while(usedC.has(c))c++;
        g.players.push({id:pid,n:String(pr.n||'Joueur').slice(0,16),c,t:0})}}

      if(all||t>g.dl){
        const bets={};for(const p of g.players){const b=A(p.id).bet;bets[p.id]=(b&&b.r===r)?clamp(Math.round(+b.n)||0,0,MAX_BET):0}

function onPeers(){

  for(const p of ps){const pr=p.presence||{};if(pr.code!==S.code||typeof pr.pid!=='string')continue;
    if(pr.pid!==ME.pid)m.set(pr.pid,pr);
    if(pr.host&&pr.g&&pr.pid!==ME.pid)host=pr}

  if(!S.isHost&&host){
    if(typeof host.now==='number'&&host.now!==S.hostPeerNow){S.hostPeerNow=host.now;const est=Date.now()-host.now;S.off=S.off==null?est:Math.min(S.off,est)}

}

/* --- reconnaissance vocale (site autonome, joueur seul) --- */
const voiceOn=()=>LS.get('li-voice',false);
let curVoice=null;
function makeVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  if(curVoice)curVoice.stop();
  const v={onText:null,onState:null,want:false,rec:null};
  v.start=()=>{if(v.want)return;v.want=true;run()};
  v.stop=()=>{v.want=false;try{v.rec&&v.rec.abort()}catch(e){}v.onState&&v.onState(false)};
  function run(){
    if(!v.want)return;
    const r=new SR();v.rec=r;r.lang='fr-FR';r.continuous=true;r.interimResults=false;r.maxAlternatives=1;
    r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal&&v.onText)v.onText(e.results[i][0].transcript)};
    r.onstart=()=>v.onState&&v.onState(true);
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){v.want=false;toast('Micro refusé : autorise-le dans ton navigateur, ou tape tes réponses.')}};
    r.onend=()=>{v.onState&&v.onState(false);if(v.want)setTimeout(run,150)};
    try{r.start()}catch(e){}
  }
  curVoice=v;return v;
}

/* ========== boucle ========== */
let lastHeartbeat=0;
function loop(){
  if(S.mode){
    if(S.isHost){step();if(S.mode==='online'&&now()-lastHeartbeat>1000&&S.nr){lastHeartbeat=now();S.nr.presence({now:now()}).catch(()=>{})}}
    render(false);
    const ov=$('#ov');const lost=S.mode==='online'&&!S.isHost&&S.g&&now()-S.lastHostSeen>6000;
    if(lost&&!ov)document.body.append(h('div',{class:'overlay',id:'ov'},h('div',{class:'card col',style:'max-width:420px'},h('h3',{class:'disp'},'L’hôte a disparu'),h('p',{style:'margin:0;font-weight:700'},'On attend qu’il revienne. S’il recharge sa page et clique sur « Reprendre la partie », tout repart.'),h('button',{class:'btn alt',onclick:()=>{$('#ov')?.remove();leave()}},'Quitter'))));
    else if(!lost&&ov)ov.remove();
  }
  requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{if(S.keyH)S.keyH(e)});
renderHome();
requestAnimationFrame(loop);
